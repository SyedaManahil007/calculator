<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>· ˚ ୨୧ cute pastel calculator ୨୧ ˚ ·</title>
    <!-- Font Awesome for small cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="cute-icon"><i class="fas fa-heart"></i></div>
            <span class="nav-title">mochi.calc</span>
        </div>
        <div class="nav-menu">
            <a href="#"><i class="fas fa-calculator"></i> calc</a>
            <a href="#"><i class="fas fa-star"></i> kawaii</a>
            <a href="#"><i class="fas fa-candy-cane"></i> sweet</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="calc-container">
            <!-- display area -->
            <div class="display-box">
                <input type="text" id="calc-display" placeholder="0" readonly value="0">
            </div>
            <!-- buttons grid -->
            <div class="buttons-grid">
                <button class="btn btn-clear" id="clear">C</button>
                <button class="btn btn-operator" id="percent">%</button>
                <button class="btn btn-operator" id="backspace"><i class="fas fa-delete-left"></i></button>
                <button class="btn btn-operator" id="divide">÷</button>

                <button class="btn" id="7">7</button>
                <button class="btn" id="8">8</button>
                <button class="btn" id="9">9</button>
                <button class="btn btn-operator" id="multiply">×</button>

                <button class="btn" id="4">4</button>
                <button class="btn" id="5">5</button>
                <button class="btn" id="6">6</button>
                <button class="btn btn-operator" id="subtract">−</button>

                <button class="btn" id="1">1</button>
                <button class="btn" id="2">2</button>
                <button class="btn" id="3">3</button>
                <button class="btn btn-operator" id="add">+</button>

                <button class="btn btn-zero" id="0">0</button>
                <button class="btn" id="dot">.</button>
                <button class="btn btn-equals" id="equals">=</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-left">
            <i class="fas fa-cherries"></i> ୨୧ with strawberry milk  <i class="fas fa-cherries"></i>
        </div>
        <div class="footer-right">
            <a href="#"><i class="fab fa-instagram"></i> @pink.calc</a>
            <a href="#"><i class="fas fa-cake-candles"></i> purin</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
